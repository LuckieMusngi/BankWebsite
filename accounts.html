<!DOCTYPE html>
<html>
<head>
  <title>Accounts</title>
  <style>
    body {
      margin: 0;
      background-color: #171717;
      color: #D3DAD9;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #1a1a1a;
      padding: 15px;
      font-weight: bold;
      text-align: center;
    }

    h1 {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .account-list {
      list-style: none;
      display: grid;
      gap: 14px;
    }

    .account-card {
      background-color: #262626;
      padding: 16px;
    }

    main {
      padding: 24px;
      max-width: 40vw;
      margin: 0 auto;
    }

    button {
      background-color: #1c1c1c;
      color: #D3DAD9;
      border: none;
      padding: 5px 5px;
    }

    .logout-btn {
      float: right;
      padding: 6px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>BankWebsite</header>
  <main>
    <button class="logout-btn" onclick="logout()">Log Out</button>
    <h1 id="username">Loading...</h1>
    <h2>Accounts</h2>
    <p class="status" id="status">Loading...</p>
    <ul class="account-list" id="account-list"></ul>
  </main>

  <script>
    function logout() {
      localStorage.removeItem('bankUsername')
      localStorage.removeItem('bankAccountNumber')
      window.location.href = 'http://localhost:8080/'
    }

    function openTransactions(accountNumber) {
      localStorage.setItem('bankAccountNumber', accountNumber)
      window.location.href = 'http://localhost:8080/transactions.html'
    }

    // loads the data for above ^
    function load() {
      const username = localStorage.getItem('bankUsername')
      // go back to login
      if (!username) {
        window.location.href = 'http://localhost:8080/'
        return
      }

      // fetch accounts
      fetch('http://localhost:8080/get-accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ Username: username })
      })
      .then(response => {
        if (!response.ok) { // only rly happens if user doesn't exist anymore
          localStorage.removeItem('bankUsername')
          window.location.href = 'http://localhost:8080/'
          return
        }
        return response.json() // this is the data for the accounts page (username, account count, accounts)
      })
      .then(data => {
        document.getElementById('username').textContent = data.userName
        document.getElementById('status').textContent = data.accountCount

        let accountHTML = ''
        for (let account of data.accounts) {
          accountHTML += `<li class="account-card">
            <div>Account Number: <a href="#" onclick="openTransactions(${account['Account #']}); return false;">${account['Account #']}</a></div>
            <div>Account Type: ${account['Account Type']}</div>
            <div>Balance: $${Number(account.Balance).toFixed(2)}</div>
            
            <form method="POST" action="/delete-account">
              <input type="hidden" name="Username" value="${username}">
              <input type="hidden" name="accountNumber" value="${account['Account #']}">
              <button type="submit" class="delete-account-btn">Delete Account</button>
            </form>
          </li>`
        }
        document.getElementById('account-list').innerHTML = accountHTML
      })
      .catch(err => {
        console.error(err)
      })
    }

    load()
  </script>
</body>
</html>
</body>

</html>
