<!DOCTYPE html>
<html>
    <head>
        <title>Log In</title>
        <script>
            function checkPassword(){
                var pass = document.getElementById('password').value
                var user = document.getElementById('username').value 
                let userData = {Username: user, Password: pass}
                fetch(`http://localhost:8080/login`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                })
                .then(response=>{
                    if(response.ok){ // ok is if login successful (ie username/password correct)
                        localStorage.setItem('bankUsername', user)
                        window.location.href = 'http://localhost:8080/accounts.html'
                    }
                    else {
                        document.getElementById('error').style['visibility'] = 'visible';
                    }
                })
            }
        </script>
        <style>
            body{
                background-color: #171717;
                color: #D3DAD9;
                font-family: Arial, sans-serif;
            }

            input{
                background-color: #1c1c1c;
                color: #D3DAD9;
            }

            button{
                background-color: #262626;
                color: #D3DAD9;            
            }
            
            a{
                color: #D3DAD9;
            }

            .error{
                color: red;
                visibility:hidden;
            }
        </style>
    </head>
    <body>
        <form id = 'login'>
            Username: <input type = 'text' name = 'username' id = 'username'><br><br>
            Password: <input type = 'password' name = 'password' id = 'password'><br><br>
            <button type = 'button' onclick = 'checkPassword()'>Submit</button>
        </form>
        <a href = 'http://localhost:8080/signup'>Create an account</a>
        <h3 id = 'error' class = 'error'>Invalid username/password.</h3>
    </body>
</html>
