<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up</title>
        <script>
            function checkPassword(){
                var errorMsgs = document.getElementsByClassName('error')
                for(let i = 0; i<errorMsgs.length;i++){
                    errorMsgs[i].style.display = 'none'
                }
                const charString = "!@#$%^&*()_+-=[]{};:'\"\\|,.<>/?~`";
                const specialChars = charString.split('');
                var passwords = document.getElementsByName('password')
                const myRegex = new RegExp('[^a-zA-Z0-9]');
                if(!(passwords[0].value == passwords[1].value)){
                    document.getElementById('matchingError').style['display'] = 'block'
                    return
                }
                if (passwords[0].value.length < 8 || /[^a-zA-Z0-9]/.test(passwords[0].value)){
                    document.getElementById('passwordError').style['display'] = 'block'
                    return
                }
                else{
                    submitForm()
                }
            }

            function submitForm(){
                var pass = document.getElementsByName('password')[0].value
                var user = document.getElementById('username').value
                let userData = {'Username': user, 'Password': pass}
                fetch(window.location.href, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                })
                .then(response=>{
                    if(response.status === 409){document.getElementById('userError').syle['display'] = 'block'}
                    else if(response.ok){window.location.href = '/'}
                    else{alert('Issue with registration. Please try again later.')}
                })
            }
        </script>
        <style>
            body {
                margin: 0;
                background-color: #171717;
                color: #D3DAD9;
                font-family: Arial, sans-serif;
            }

            header {
                background-color: #1a1a1a;
                padding: 15px;
                font-weight: bold;
                text-align: center;
            }
           .error{
            color: red;
            display:none;
           } 
        </style>
    </head>
    <body>
        <form id = 'signUp'>
            Username:<br><input type = 'text' name = 'username' id = 'username'><br><br>
            Password: <br><input type = 'password' name = 'password'><br>
            <ul class = 'error' id = 'passwordError'>
                <li>Must be at least 8 characters long.</li>
                <li>There must be no special characters.</li>
            </ul>
            Confirm Password: <br><input type = 'password' name = 'password'><br><br>
            <p class = 'error' id = 'matchingError'>Passwords must match.</p>
            <button type = 'button' onclick = 'checkPassword()'>Enter</button>
            <h3 class = 'error' id = 'userError'>Username already taken.</h3>
        </form>
        <form id = 'accounts'></form>
    </body>
</html>
