<!DOCTYPE html>
<html>
<head>
  <title>Accounts</title>
  <style>
    body {
      margin: 0;
      background-color: #171717;
      color: #D3DAD9;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #1a1a1a;
      padding: 15px;
      font-weight: bold;
      text-align: center;
    }

    h1 {
      color: #D3DAD9;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status {
      color: #D3DAD9;
    }

    .account-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 14px;
    }

    .account-card {
      background-color: #262626;
      padding: 16px;
    }

    .account-card strong {
      color: #D3DAD9;
    }

    main {
      padding: 24px;
      max-width: 40vw;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <header>Bank App Project</header>
  <main>
    <h1>__USERNAME__</h1>
    <h2>Accounts</h2>
    <p class="status">__STATUS__</p>
    <ul class="account-list">__ACCOUNT_LIST__</ul>
  </main>
</body>

</html>
